<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect | Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Section -->

    <div class="left">

        <h1>CampusConnect</h1>

        <h2>Create Your Account</h2>

        <p>
            Join thousands of students and connect with your campus community.
        </p>

        <div class="features">

            <div>
                <i class="fas fa-user-graduate"></i>
                <span>Student Network</span>
            </div>

            <div>
                <i class="fas fa-book"></i>
                <span>Study Resources</span>
            </div>

            <div>
                <i class="fas fa-calendar"></i>
                <span>Campus Events</span>
            </div>

            <div>
                <i class="fas fa-comments"></i>
                <span>Discussions</span>
            </div>

        </div>

    </div>

    <!-- Register Card -->

    <div class="register-card">

        <h2>Create Account</h2>

        <form method="POST" action="/register">

            <!-- Full Name -->

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input
                    type="text"
                    name="fullname"
                    placeholder="Full Name"
                    required>

            </div>

            <!-- USN -->

            <div class="input-box">

                <i class="fas fa-id-card"></i>

                <input
                    type="text"
                    name="usn"
                    placeholder="USN"
                    required>

            </div>

            <!-- Email -->

            <div class="input-box">

                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="College Email"
                    required>

            </div>

            <!-- Phone -->

            <div class="input-box">

                <i class="fas fa-phone"></i>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required>

            </div>

            <!-- Password -->

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <i
                    id="togglePassword"
                    class="fas fa-eye eye"></i>

            </div>

            <!-- Password Strength -->

            <div class="strength">
                <div id="strength-bar"></div>
            </div>

            <p id="strength-text">
                Password Strength
            </p>

            <!-- Confirm Password -->

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    id="confirmPassword"
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required>

            </div>

            <p id="match-text"></p>

            <!-- Register Button -->

            <button type="submit" class="register-btn">
                Create Account
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <button
                type="button"
                class="google">

                <i class="fab fa-google"></i>

                Continue with Google

            </button>

            <p class="login-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
